name: Playwright

on:
  push:
    branches:
      - main
    paths:
      - '**/playwright/**'
  pull_request:
    paths:
      - '**/playwright/**'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ reporter, grid, saucectl, native ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - name: Install dependencies
        working-directory: playwright
        run: npm install
      - name: Install WebKit system dependencies
        # The native project uses the Desktop Safari (WebKit) preset, so the runner needs WebKit's OS libraries
        if: matrix.target == 'native'
        working-directory: playwright
        run: npx playwright install-deps webkit
      - name: Run ${{matrix.target}} tests
        working-directory: playwright
        run: npm run test.${{matrix.target}}
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
